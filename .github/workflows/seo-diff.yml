name: SEO diff (post-deploy)

# Runs seo-diff (per environment), the runtime JSON-LD checker, and the
# combined lint report after every push to main. Posts a PR comment summary
# when the workflow runs on a pull_request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to diff (production / staging / preview)"
        required: false
        default: "production"
        type: choice
        options: [production, staging, preview]
      base:
        description: "Explicit base URL override (skips env picker)"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  seo-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        env: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON(format('["{0}"]', inputs.env))
              || fromJSON('["staging","production"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Wait for deploy to propagate
        if: github.event_name == 'push'
        run: sleep 120

      - name: Run redirect/canonical diff — ${{ matrix.env }}
        env:
          SEO_DIFF_ENV: ${{ matrix.env }}
        run: |
          mkdir -p artifacts
          if [ -n "${{ github.event.inputs.base }}" ]; then
            node scripts/seo-diff.mjs "${{ github.event.inputs.base }}" \
              --out artifacts/seo-diff-${{ matrix.env }}.json
          else
            node scripts/seo-diff.mjs --env=${{ matrix.env }} \
              --out artifacts/seo-diff-${{ matrix.env }}.json
          fi

      - name: Runtime JSON-LD check — ${{ matrix.env }}
        if: always()
        run: node scripts/runtime-jsonld-check.mjs --env=${{ matrix.env }} --out artifacts/jsonld-${{ matrix.env }}.json

      - name: Upload diff + jsonld report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-diff-${{ matrix.env }}
          path: artifacts/

  lint-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [seo-diff]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Download seo-diff artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
        continue-on-error: true

      - name: Collect artifacts for report
        run: |
          mkdir -p artifacts/lint
          find downloaded -type f \( -name 'seo-diff-*.json' -o -name 'jsonld-*.json' \) \
            -exec cp {} artifacts/lint/ \; || true

      - name: Generate combined lint report
        run: node scripts/lint-report.mjs --out-dir artifacts/lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: artifacts/lint/

      - name: Post PR summary comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIFF_ARGS=""
          for f in artifacts/lint/seo-diff-*.json; do
            [ -f "$f" ] && DIFF_ARGS="$DIFF_ARGS --diff $f"
          done
          JSONLD=""
          for f in artifacts/lint/jsonld-*.json; do
            [ -f "$f" ] && JSONLD="--jsonld $f" && break
          done
          node scripts/pr-comment.mjs $DIFF_ARGS $JSONLD --lint-md artifacts/lint/lint-report.md

  baseline-guard:
    # Refuse to overwrite scripts/seo-baseline.json in CI unless someone sets
    # SEO_BASELINE_APPROVE=1 as a workflow env / secret. The regen script
    # itself enforces this; this job just documents the entrypoint.
    if: github.event_name == 'workflow_dispatch' && inputs.env != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Propose new baseline (never overwrites without SEO_BASELINE_APPROVE=1)
        env:
          SEO_BASELINE_APPROVE: ${{ vars.SEO_BASELINE_APPROVE || '' }}
        run: node scripts/regen-baseline.mjs --env=${{ inputs.env }} --approve || true
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-proposal-${{ inputs.env }}
          path: scripts/seo-baseline.proposed.*.json
